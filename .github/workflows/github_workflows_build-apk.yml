name: Build APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Build branch'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - pre-release
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ inputs.build_type }} from ${{ inputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: ./gradlew assembleDebug

      - name: Build Pre-release APK
        if: inputs.build_type == 'pre-release'
        run: ./gradlew assembleRelease -x signReleaseBundle

      - name: Build Release APK
        if: inputs.build_type == 'release'
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: app/build/outputs/apk/
          retention-days: 30

      - name: Create build summary
        run: |
          echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK artifacts are available in the Actions artifacts section." >> $GITHUB_STEP_SUMMARY